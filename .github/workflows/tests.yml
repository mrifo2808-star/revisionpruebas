name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Python 3.11 -- misma version declarada en .devcontainer/devcontainer.json
    # (mcr.microsoft.com/devcontainers/python:1-3.11-bookworm), para que CI
    # refleje el entorno de desarrollo/produccion real del proyecto.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: py_compile (modulos principales)
        run: |
          python -m py_compile app_revisor.py
          python -m py_compile registro_sheets.py
          python -m py_compile gestionar_usuarios.py
          python -m py_compile omr_metrics.py
          python -m py_compile ground_truth_tool.py

      - name: pytest
        # Sin credenciales reales: los tests usan monkeypatch/mocks sobre
        # Google Sheets y extraen funciones puras de app_revisor.py sin
        # ejecutar su UI de Streamlit, asi que no requieren
        # .streamlit/secrets.toml, AUTH_COOKIE_SECRET ni la API de Anthropic.
        run: python -m pytest tests -q
